<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMU · 搭配挂机</title>
<style>
:root{--bg:#0e0c0a;--panel:#191613;--panel2:#221e1a;--line:#3a322a;--gold:#e8b75a;--txt:#ebe4d8;--dim:#9a8f80;--red:#e05a4a;--green:#3ddc84;--blue:#4aa3ff;--leg:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:var(--txt);background:#2c2620;border:1px solid #4a3f33;border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:linear-gradient(#7a5420,#4a3212);border-color:#b08a40;color:#ffe9b8}
button.dan{background:linear-gradient(#7a2a20,#4a1612);border-color:#b04a3a;color:#ffd0c8}
button.sm{padding:2px 7px;font-size:12px}
select,input{font:inherit;background:#2c2620;color:var(--txt);border:1px solid #4a3f33;border-radius:6px;padding:3px 6px}
#app{max-width:560px;margin:0 auto;padding:8px}
.top{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.lv{color:#ffe4a8;font-weight:700}
.bar{position:relative;height:14px;background:#000;border:1px solid #3a322a;border-radius:7px;overflow:hidden;flex:1;min-width:80px}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0}
.bar>b{position:absolute;left:0;top:0;bottom:0;width:0;background:#9fd8ff88}
.bar>span{position:relative;display:block;text-align:center;font-size:10px;line-height:12px;color:#fff;text-shadow:0 0 2px #000}
.exp>i{background:linear-gradient(90deg,#8a6a1a,#e8b75a)}
.hp>i{background:linear-gradient(90deg,#7a1a14,#e05a4a)}
.res>i{background:linear-gradient(90deg,#5a2a8a,#c07aff)}
.gold{color:var(--gold);font-weight:600}
.muted{color:var(--dim);font-size:12px}
.r0{color:#d0d0d0}.r1{color:var(--blue)}.r2{color:var(--green)}.r3{color:var(--leg)}
.panel{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:220px}
h4{margin:4px 0 8px;color:var(--gold);font-size:13px}
.eqgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.item,.slot{position:relative;height:54px;border-radius:8px;background:var(--panel2);border:1px solid #3a322a;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;user-select:none}
.slot .lb{position:absolute;left:4px;top:2px;font-size:10px;color:var(--dim)}
.slot{border-style:dashed}.slot .ic{opacity:.25;filter:grayscale(1)}
.item.r1{border-color:#2f6aa8}.item.r2{border-color:#2fa864}.item.r3{border-color:#c88a10;background:linear-gradient(#2a2214,#1d1810)}
.item .pl{position:absolute;right:3px;top:1px;font-size:10px;font-weight:700;color:#ffe4a8}
.item .el{position:absolute;left:3px;top:1px;font-size:10px}
.item .lk{position:absolute;left:3px;bottom:1px;font-size:10px}
.item .ar{position:absolute;right:3px;bottom:1px;font-size:10px;color:var(--green)}
.item.g1{box-shadow:0 0 6px #ffffff55 inset}
.item.g2{box-shadow:0 0 8px #4aa3ff inset,0 0 6px #4aa3ff88}
.item.g3{box-shadow:0 0 10px #ffc23a inset,0 0 8px #ffb020aa}
.item.g4{box-shadow:0 0 12px #ff4a3a inset,0 0 12px #ffb020;animation:ip 1.2s infinite}
@keyframes ip{50%{box-shadow:0 0 16px #ff4a3a inset,0 0 18px #ffd060}}
.item.sel{outline:2px solid var(--gold)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:12px}
.kv div{display:flex;justify-content:space-between}
.kv b{color:#ffe4a8;font-weight:600}
.attr{display:grid;grid-template-columns:42px 54px 1fr auto;gap:6px;align-items:center;margin-top:4px}
.attr .v{color:#ffe4a8;font-weight:700}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.card .t{font-weight:700;font-size:14px}
.af{color:#8ab8ff;font-size:12px}
.leg{color:var(--leg);font-size:12px}
.bad{color:var(--red)}
.good{color:var(--green)}
.bonds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:11px;text-align:center}
.bonds div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 2px}
.bonds .on{border-color:var(--gold);color:#ffe4a8}
.skslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sks{background:var(--panel2);border:1px dashed #5a4a3a;border-radius:8px;padding:6px;min-height:58px;cursor:pointer}
.sks.cur{border-style:solid;border-color:var(--gold)}
.sks .sn{font-weight:700}
.skl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed #3a322a}
.skl.no{opacity:.4}
.tal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tal div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;font-size:12px}
.tal div.on{border-color:var(--gold);background:#2e2416}
.hbar{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0}
.hbar .nm{width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.hbar .tr{flex:1;height:10px;background:#000;border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--gold)}
.hbar .v{width:58px;text-align:right}
.tips li{margin:3px 0}
.big{font-size:18px;font-weight:800;color:#ffe4a8}
.sel3{display:flex;gap:6px;flex-wrap:wrap}
.sel3 button.on{background:#6b4a1c;border-color:var(--gold);color:#ffe4a8}
.zone{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.zone.lock{opacity:.5}
.shop .r,.set .r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed #3a322a}
textarea{width:100%;height:64px;background:#0c0b09;color:#cfc6b8;border:1px solid #3a322a;border-radius:6px;font:11px monospace}
.upres{margin-top:8px;padding:8px;border-radius:8px;text-align:center;font-weight:700}
.upres.ok{background:#16351f;color:#7affb0}
.upres.down,.upres.guard{background:#3a2a10;color:#ffc060}
.upres.break{background:#3a1410;color:#ff7a6a;animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2c2620f0;border:1px solid var(--gold);color:#ffe4a8;padding:6px 14px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;max-width:90vw}
#toast.on{opacity:1}
#mw{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
#mw.hidden{display:none}
#modal{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:14px;width:min(94vw,420px);max-height:88vh;overflow:auto}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.clsel{display:grid;gap:8px}
.clsel .c{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.clsel .c:hover{border-color:var(--gold)}
.clsel .c .h{font-size:16px;font-weight:800;color:#ffe4a8}

.arena{position:relative;margin-top:8px;height:240px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#111}
.arena.bossf{box-shadow:inset 0 0 40px #c0201888}
#bg,#bg svg{position:absolute;inset:0;width:100%;height:100%}
.ember{animation:emb 2.4s ease-in infinite}
@keyframes emb{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
.hud{position:absolute;left:8px;top:8px;width:46%;z-index:20;display:grid;gap:3px}
.hud .bar{height:13px;background:#000a}
.hud .rs>i{background:linear-gradient(90deg,#5a2a8a,#c07aff)}
.hud .hp>span,.hud .rs>span{text-align:left;padding-left:6px}
.btimer{position:absolute;right:8px;top:8px;z-index:20;font-size:12px;color:#ffc0b0;font-weight:700;text-shadow:0 0 3px #000}
.banner{position:absolute;left:0;right:0;top:46px;text-align:center;font-weight:900;font-size:18px;color:#7affd0;text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none;z-index:25;animation:pop .3s}
.hero{position:absolute;left:4%;bottom:12px;width:112px;height:150px;z-index:12}
.hwrap{width:100%;height:100%}
.hsvg{width:100%;height:100%;overflow:visible}
.hsvg .fig{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.hsvg .arm{transform-origin:72px 60px}
.hsvg .aur{animation:aur 1.6s ease-in-out infinite}
@keyframes aur{50%{opacity:.25}}
.hero.atk.cls-sw .hwrap{animation:lunge .28s ease-out}
.hero.atk.cls-sw .arm{animation:swing .28s ease-out}
.hero.atk.cls-mg .arm{animation:cast .3s ease-out}
.hero.atk.cls-mg .orb{animation:orb .3s}
.hero.atk.cls-ar .arm{animation:draw .26s ease-out}
@keyframes lunge{40%{transform:translateX(26px)}}
@keyframes swing{0%{transform:rotate(-30deg)}45%{transform:rotate(-80deg)}75%{transform:rotate(35deg)}100%{transform:rotate(0)}}
@keyframes cast{40%{transform:rotate(-22deg)}}
@keyframes orb{40%{r:9}}
@keyframes draw{40%{transform:translateX(-5px)}}
.hero.frz .hwrap{filter:hue-rotate(160deg) brightness(1.4)}
.hero.rest .hwrap{opacity:.7}
.hst{position:absolute;right:-6px;top:0;font-size:18px}
#mons{position:absolute;inset:0}
.mob{position:absolute;width:58px;margin-left:-29px;text-align:center;z-index:10;animation:mbob 1.6s ease-in-out infinite;transition:opacity .35s,transform .35s}
.mob::after{content:'';position:absolute;left:12px;right:12px;bottom:-3px;height:7px;border-radius:50%;background:#0008;z-index:-1}
.mob .mi{font-size:38px;line-height:44px;display:inline-block;transform:scaleX(-1)}
.mob.add .mi{font-size:28px}
.mob.boss{width:120px;margin-left:-60px}
.mob.boss .mi{font-size:78px;line-height:84px;filter:drop-shadow(0 0 10px #e05a4a)}
.mob .mbar{position:relative;height:5px;margin:0 6px 2px;background:#000c;border-radius:3px;overflow:hidden}
.mob.boss .mbar{height:8px;margin:0}
.mob .mbar i{position:absolute;left:0;top:0;bottom:0;background:#e05a4a}
.mob .mbar b{position:absolute;left:0;top:0;bottom:0;background:#9fd8ffcc}
.mob .mst{height:14px;font-size:11px;letter-spacing:-1px;white-space:nowrap}
.mob .bn{font-size:11px;color:#ffb0a0;font-weight:700;text-shadow:0 0 3px #000}
.mob.hit .mi{animation:mhit .18s}
@keyframes mhit{0%{filter:brightness(3)}50%{transform:scaleX(-1) translateX(-6px)}100%{filter:none}}
.mob.frz .mi{filter:hue-rotate(170deg) brightness(1.5) saturate(.5)}
.mob.dead{opacity:0;transform:translateY(10px) rotate(20deg)}
@keyframes mbob{50%{transform:translateY(-3px)}}
.proj{position:absolute;width:10px;height:10px;border-radius:50%;z-index:15;transition:left .22s linear,top .22s linear;pointer-events:none}
.proj.arrow{width:18px;height:3px;border-radius:2px}
.fxn{position:absolute;font-weight:800;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 0 3px #000,0 0 2px #000;z-index:30;white-space:nowrap}
.fxn.crit{color:#ffd23a;font-size:16px}.fxn.react{color:#5affc0;font-size:17px}.fxn.h{color:#ff6a5a}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.slog{position:absolute;left:8px;bottom:2px;right:30%;z-index:20;font-size:11px;color:#e8dcc8;text-shadow:0 0 3px #000;pointer-events:none}
.slog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slog .lv{color:#ffe4a8}.slog .warn{color:#ffb060}.slog .boss{color:#ff9a8a}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{flex:1;padding:4px 0;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
.tabs .ti{font-size:18px}.tabs .tt{font-size:10px;color:var(--dim)}
.tabs button.on{background:#6b4a1c;border-color:#a07a3a}.tabs button.on .tt{color:#ffe4a8}
.res{font-size:12px;color:var(--dim)}
.doll{display:grid;grid-template-columns:58px 1fr 58px;gap:8px;align-items:center}
.dcol{display:grid;gap:6px}
.dmid{text-align:center;background:radial-gradient(ellipse at 50% 85%,#3a2a18 0%,#1a1612 70%);border:1px solid var(--line);border-radius:12px;padding:6px 0}
.dfig{height:230px}
.dfig .hsvg{width:auto;height:100%}
.dname{font-weight:700;color:#ffe4a8}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.chips span{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700;color:#ffe4a8}
.bonds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;text-align:center}
.bonds div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 0;font-size:16px}
.bonds div b{font-size:12px;margin-left:3px;color:var(--dim)}
.bonds .on{border-color:var(--gold)}.bonds .on b{color:#ffe4a8}
.pts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 8px;display:flex;gap:4px;align-items:center}
.loads{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ld{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 8px;display:flex;gap:4px;align-items:center;font-size:12px}
.more{margin-top:8px;font-size:12px}
.more summary{cursor:pointer;color:var(--dim)}
body.mini #app{max-width:380px;padding:4px}
body.mini .tabs,body.mini .panel,body.mini .hide-mini{display:none}
body.mini .arena{height:200px}
.item img.ii{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px;z-index:0}
.item .pl,.item .el,.item .lk,.item .ar{z-index:1;text-shadow:0 0 3px #000}
.portrait{height:100%;max-width:100%;object-fit:contain;border-radius:8px}
.portrait.glow2{filter:drop-shadow(0 0 6px #5ab4ff)}.portrait.glow3{filter:drop-shadow(0 0 8px #ffc23a)}.portrait.glow4{filter:drop-shadow(0 0 10px #ff5a3a);animation:pulse4 1.4s infinite}
@keyframes pulse4{50%{filter:drop-shadow(0 0 16px #ffd060)}}
.prev{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.prev .portrait{width:100%;height:auto}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;grid-column:1/3}
.pgrid div{text-align:center;font-size:11px;color:var(--dim)}
.pgrid img{width:100%;border-radius:8px;border:1px solid #c88a10;display:block}
.hero.art{width:128px;height:172px;left:2%;bottom:6px}
.spr{position:relative;width:100%;height:100%}
.spr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;transform:scaleX(-1);transform-origin:50% 100%;animation:breathe 2.2s ease-in-out infinite;z-index:2}
@keyframes breathe{0%,100%{transform:scaleX(-1) scaleY(1) translateY(0)}50%{transform:scaleX(-1) scaleY(1.018) translateY(-2px)}}
.spr .aura{position:absolute;left:10%;right:10%;top:8%;bottom:4%;border-radius:50%;z-index:1;opacity:0;background:radial-gradient(closest-side,rgba(255,215,120,.55),transparent);animation:aur 1.6s ease-in-out infinite}
.spr.g1 .aura{opacity:.4}.spr.g2 .aura{opacity:.7}.spr.g3 .aura{opacity:1}.spr.g4 .aura{opacity:1;background:radial-gradient(closest-side,rgba(255,120,60,.6),rgba(255,215,120,.3),transparent)}
.spr.g2 img{filter:drop-shadow(0 0 4px #ffd27a)}.spr.g3 img{filter:drop-shadow(0 0 7px #ffc23a)}.spr.g4 img{filter:drop-shadow(0 0 9px #ff8a3a) brightness(1.08)}
.spr .spk{position:absolute;inset:0;z-index:3;pointer-events:none}
.spr .spk i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff3b0;box-shadow:0 0 6px #ffc23a;opacity:0;animation:spk 2.4s linear infinite}
.spr.g2 .spk i,.spr.g3 .spk i,.spr.g4 .spk i{opacity:1}
.spr .spk i:nth-child(1){left:20%;animation-delay:0s}.spr .spk i:nth-child(2){left:45%;animation-delay:.5s}.spr .spk i:nth-child(3){left:70%;animation-delay:1s}.spr .spk i:nth-child(4){left:30%;animation-delay:1.5s}.spr .spk i:nth-child(5){left:60%;animation-delay:1.9s}
@keyframes spk{0%{bottom:5%;opacity:0}20%{opacity:1}100%{bottom:85%;opacity:0}}
.spr .slash{position:absolute;right:-40%;top:15%;width:80%;height:60%;z-index:4;opacity:0;pointer-events:none}
.hero.art.atk .hwrap{animation:lunge2 .32s ease-out}
.hero.art.atk .slash{animation:slash .32s ease-out}
@keyframes lunge2{0%{transform:none}35%{transform:translateX(30px) rotate(6deg)}100%{transform:none}}
@keyframes slash{0%{opacity:0;transform:rotate(-40deg) scale(.6)}30%{opacity:1}100%{opacity:0;transform:rotate(25deg) scale(1.1)}}
.hero.art.atk.cls-mg .hwrap{animation:cast2 .32s ease-out}
.hero.art.atk.cls-ar .hwrap{animation:draw2 .3s ease-out}
@keyframes cast2{35%{transform:translateX(8px) translateY(-4px)}}
@keyframes draw2{35%{transform:translateX(-8px)}}
.spr .cflash{position:absolute;right:-6%;top:22%;width:40%;height:40%;border-radius:50%;z-index:4;opacity:0;pointer-events:none}
.cls-mg .spr .cflash{background:radial-gradient(closest-side,#e8d4ff,#8a5aff88,transparent)}
.cls-ar .spr .cflash{background:radial-gradient(closest-side,#f0ffd0,#7acc5a88,transparent)}
.hero.art.atk .cflash{animation:cflash .32s ease-out}
@keyframes cflash{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
.spr.tt2 .aura{background:radial-gradient(closest-side,rgba(200,215,235,.55),transparent)}
.spr.tt3 .aura{background:radial-gradient(closest-side,rgba(120,190,255,.6),transparent)}
.spr.tt4 .aura{background:radial-gradient(closest-side,rgba(255,110,60,.6),transparent)}
.spr.tt3 img{filter:drop-shadow(0 0 5px #5ab4ff)}.spr.tt4 img{filter:drop-shadow(0 0 6px #ff6a3a)}
.pv3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;grid-column:1/3}
.pv3 div{text-align:center;font-size:12px;color:var(--dim)}.pv3 img{width:100%;height:150px;object-fit:contain;background:radial-gradient(ellipse at 50% 85%,#3a2a10,transparent 70%)}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rc{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #3a3226;border-radius:10px;cursor:pointer;background:#1c1812}
.rc:hover{border-color:#c88a10}.rc.on{border-color:#ffc23a;box-shadow:0 0 8px #ffc23a55}
.rc img{width:48px;height:64px;object-fit:contain}.rc .plus{width:48px;height:64px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#c88a10}
.cform{display:grid;gap:6px;margin:8px 0}.cform input{padding:8px;border-radius:8px;border:1px solid #3a3226;background:#14110c;color:#eee;font-size:15px}
.dfig .big{height:100%;aspect-ratio:3/4;margin:auto;background:radial-gradient(ellipse at 50% 85%,#3a2a10,transparent 70%)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="mw" class="hidden"><div id="modal"></div></div>
<script>
/*ENGINE*/
</script>
<script>
/*UI*/
</script>
</body>
